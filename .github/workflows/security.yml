name: WMS security and correctness
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workplace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Pinned browser dependencies and runtime adapter integrity
        working-directory: web
        run: |
          node --version
          npm ci --ignore-scripts --no-fund
          npm audit --omit=dev --audit-level=high
          npx playwright install --with-deps chromium --only-shell
      - name: Polish workplace, exact quantities and persistent command regressions
        working-directory: web
        run: |
          mkdir -p work
          set -o pipefail
          npm test 2>&1 | tee work/unit-tests.txt
          npm run test:browser 2>&1 | tee work/browser-tests.txt
      - name: Independent workplace behavioral mutations
        run: |
          python3 scripts/verify_ui_mutations.py --node node --output work/ui-mutations.json
          python3 tests/ui_backend_mutations.py --go go
          python3 scripts/verify_workplace_setup.py --output work/workplace-setup-mutations.json
          python3 scripts/verify_address_recovery.py --output work/address-recovery-mutations.json
      - name: Workplace evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workplace-test-evidence
          path: |
            web/work/
            web/test-results/
            work/ui-mutations*
            work/ui-backend-mutations/
            work/workplace-setup-mutations*
            work/address-recovery-mutations*
          if-no-files-found: error
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: wms_test_admin
          POSTGRES_PASSWORD: unused-disposable-ci
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wms_test_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      WMS_TEST_ADMIN_DSN: postgres://wms_test_admin@127.0.0.1:5432/wms_kernel_test_backend?sslmode=disable
      WMS_TEST_RUNTIME_DSN: postgres://wms_go_runtime@127.0.0.1:5432/wms_kernel_test_backend?sslmode=disable
      WMS_DOCUMENT_PLAN_DIR: ${{ github.workspace }}/work/document-plans
      WMS_DOCUMENT_CRITIC_PLAN_DIR: ${{ github.workspace }}/work/document-critic-plans
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verification gate and migration recipe unit regressions
        run: |
          mkdir -p work
          set -o pipefail
          python3 -m unittest discover -s scripts -p 'test_*.py' 2>&1 | tee work/python-tests.txt
      - name: Prepare disposable database
        run: python3 scripts/prepare-test-db.py --psql psql --port 5432
      - name: Browser for real PostgreSQL receiving and putaway workflow
        working-directory: web
        run: |
          node --version
          npm ci --ignore-scripts --no-fund
          npx playwright install --with-deps chromium --only-shell
      - name: Installer, Hyper-V driver and deployment mutation regressions
        run: |
          set -o pipefail
          command -v pwsh
          python3 -m pip install --disable-pip-version-check --target work/hyperv-deps pycdlib==1.14.0
          export PYTHONPATH="$PWD/work/hyperv-deps"
          python3 -m unittest discover -s tests -p 'test*installer*.py' 2>&1 | tee work/installer-tests.txt
          python3 -m unittest discover -s tests -p 'test_hyperv_bootstrap.py' 2>&1 | tee work/hyperv-tests.txt
          python3 deploy/linux/verify_installer.py
      - name: Monitoring semantics with real Prometheus query evaluation
        run: |
          set -o pipefail
          mkdir -p work/promtool-package
          curl --fail --location --silent --show-error --retry 3 --output work/promtool-package/prometheus.deb 'https://archive.ubuntu.com/ubuntu/pool/universe/p/prometheus/prometheus_2.45.3+ds-2ubuntu0.3_amd64.deb'
          echo '299dda2866a1efa3a085ac19938528eb918a66c74ccc8025ffc59a753f78d8d3  work/promtool-package/prometheus.deb' | sha256sum --check
          dpkg-deb -x work/promtool-package/prometheus.deb work/promtool-package/unpacked
          python3 scripts/verify_monitoring.py --promtool work/promtool-package/unpacked/usr/bin/promtool --output work/monitoring-verification.json
      - name: Migration recipes and database upgrade regressions
        run: |
          python3 scripts/verify-migrations.py --psql psql --port 5432
      - name: Formatting and static analysis
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet -tags=integration,hardened,arena ./...
          go mod verify
          go fix -tags=integration,hardened,arena ./...
          git diff --exit-code
      - name: Race, integration and security regressions
        run: |
          mkdir -p work
          set -o pipefail
          go test -race -tags=integration ./... -count=1 -timeout=600s -json | tee work/go-tests.jsonl
      - name: SQL kernel regressions and complete report
        run: |
          python3 tests/postgres_kernel.py --psql psql --port 5432 --database wms_kernel_test_backend --admin wms_test_admin --report work/postgres-kernel.json
          python3 scripts/summarize-tests.py --events work/go-tests.jsonl --legacy work/postgres-kernel.json --output work/verification.json --go "$(go version)" --postgres "$(psql -h 127.0.0.1 -U wms_test_admin -d wms_kernel_test_backend -Atc 'SHOW server_version')"
      - name: WMS kernel mutation gate
        run: python3 scripts/mutation_runner.py --go go --psql psql --report work/kernel-mutations.json
      - name: Known vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-test-evidence
          path: |
            work/go-tests.jsonl
            work/postgres-kernel.json
            work/verification.json
            work/migration-verification.json
            work/python-tests.txt
            work/installer-tests.txt
            work/hyperv-tests.txt
            work/monitoring-verification.json
            work/vm-installer-*/**
            work/document-mutations.json
            work/kernel-mutations.json
            work/mutations-*/**/*.jsonl
            work/mutations-*/**/stderr.txt
            work/mutations-*/**/mutant.txt
            work/mutations-*/**/python-events.json
            work/mutations-*/**/scripts/migrate_core.py
            work/windows-migration-verification.json
            work/ui-live-browser/
            work/document-plans/
            work/document-critic-plans/
          if-no-files-found: error
  hardened:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: arena_admin
          POSTGRES_PASSWORD: unused-disposable-ci
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arena_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      WMS_HARDENED_PLAN_DIR: work/hardened-plans
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Hardened profile RED, GREEN, race and behavioral mutations
        run: python3 scripts/hardened_gate.py --psql psql --port 5432 --go go --output work/hardened
      - name: Independent SQL credential permission matrix
        run: python3 scripts/security_arena.py --psql psql --port 5432 --go go --report work/arena-green.json
      - name: Hardened evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hardened-test-evidence
          path: |
            work/hardened/
            work/hardened-plans/
            work/arena-green*
            work/security-arena-*/*.log
          if-no-files-found: error
  runtime-durability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build isolated PostgreSQL runtime laboratory
        run: docker build --file tests/resilience.Dockerfile --tag wms-runtime tests
      - name: Actual unsafe settings and durable API and worker transactions
        run: |
          mkdir -p work/runtime
          chmod 0777 work/runtime
          go_root="$(go env GOROOT)"
          docker run --rm --entrypoint python3 --env CGO_ENABLED=0 --env GOROOT=/usr/local/go --env GOFLAGS=-buildvcs=false --env GOCACHE=/repo/work/go-build-cache --env GOPATH=/repo/work/go-mod-cache --mount "type=bind,source=$PWD,target=/repo,readonly" --mount "type=bind,source=$PWD/work/runtime,target=/repo/work" --mount "type=bind,source=$go_root,target=/usr/local/go,readonly" --mount "type=bind,source=/etc/ssl/certs/ca-certificates.crt,target=/etc/ssl/certs/ca-certificates.crt,readonly" wms-runtime /repo/scripts/test_onprem_recovery_critic.py --runtime-probe --pg-bin /usr/lib/postgresql/17/bin --go /usr/local/go/bin/go --report /repo/work/runtime.json
      - name: Preserve compiler diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          target = Path('work/runtime-diagnostics')
          target.mkdir(parents=True, exist_ok=True)
          for source in Path('work/runtime').glob('onprem-runtime-critic-*/build.txt'):
              shutil.copyfile(source, target / (source.parent.name + '-build.txt'))
          PY
      - name: Runtime durability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-durability-evidence
          path: |
            work/runtime/runtime.json
            work/runtime-diagnostics/
          if-no-files-found: error
  resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build PostgreSQL process-crash laboratory
        run: docker build --file tests/resilience.Dockerfile --tag wms-resilience tests
      - name: Abrupt process termination, WAL recovery and isolated restore
        run: |
          mkdir -p work/resilience
          chmod 0777 work/resilience
          docker run --rm --mount "type=bind,source=$PWD,target=/repo,readonly" --mount "type=bind,source=$PWD/work/resilience,target=/evidence" wms-resilience --repo /repo --work-root /evidence --pg-bin /usr/lib/postgresql/17/bin --report /evidence/final.json --cycles 3 --seconds 10 --writers 2
      - name: Collect evidence without reading private PGDATA
        if: always()
        run: docker run --rm --entrypoint python3 --mount "type=bind,source=$PWD,target=/repo,readonly" --mount "type=bind,source=$PWD/work/resilience,target=/evidence" wms-resilience /repo/scripts/collect_resilience_evidence.py --root /evidence --output /evidence/published
      - name: Resilience evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resilience-test-evidence
          path: work/resilience/published/
          if-no-files-found: error
